<div class="bg-slate-50 border border-slate-200 p-8 rounded-2xl shadow-sm">
    <h3 class="text-2xl font-bold text-slate-900 mb-6">Send Us an Enquiry</h3>
    
    <!-- Form -->
    <form action="https://api.web3forms.com/submit" method="POST" id="contactForm" class="space-y-6">
        
        <!-- Replace with your actual Access Key (Get it free instantly at https://web3forms.com) -->
        <input type="hidden" name="access_key" value="2e2b38d2-a228-471c-b573-7dafddaa14b5">
        <input type="hidden" name="subject" value="New Property Enquiry - Prime Real Estates">

        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Full Name</label>
            <input type="text" name="name" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white" placeholder="Enter your full name">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Phone Number</label>
            <input type="tel" name="phone" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white" placeholder="+91 XXXXX XXXXX">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Email Address</label>
            <input type="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white" placeholder="you@company.com">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Asset Interest / Division</label>
            <select name="division" class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white">
                <option>Residential Property</option>
                <option>Commercial & Corporate Parks</option>
                <option>Industrial & Warehousing</option>
                <option>Hospitals & Healthcare</option>
                <option>Institutional Real Estate</option>
                <option>Agricultural Land</option>
            </select>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-2">Message / Requirement</label>
            <textarea name="message" rows="4" required class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 focus:outline-none bg-white" placeholder="Describe your property requirement..."></textarea>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white font-semibold py-4 rounded-xl hover:bg-blue-700 transition shadow-lg">Submit Enquiry</button>
    </form>

    <!-- Dynamic Success / Error Notification Box -->
    <div id="formResult" class="hidden mt-6 p-6 rounded-xl text-center"></div>
</div>

<!-- Script to handle submission asynchronously on GitHub Pages -->
<script>
const form = document.getElementById('contactForm');
const result = document.getElementById('formResult');
const submitBtn = document.getElementById('submitBtn');

form.addEventListener('submit', function(e) {
    e.preventDefault();
    const formData = new FormData(form);
    const object = Object.fromEntries(formData);
    const json = JSON.stringify(object);
    
    submitBtn.disabled = true;
    submitBtn.textContent = "Sending...";
    result.classList.add('hidden');

    fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: json
        })
        .then(async (response) => {
            let jsonResponse = await response.json();
            result.classList.remove('hidden');
            if (response.status == 200) {
                result.className = "mt-6 p-6 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-center";
                result.innerHTML = `
                    <div class="text-3xl font-bold mb-2">✓</div>
                    <h4 class="font-bold text-lg mb-1">Enquiry Sent Successfully!</h4>
                    <p class="text-sm mb-4">Thank you. We have received your requirement and will contact you shortly.</p>
                    <button onclick="resetForm()" class="bg-emerald-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-emerald-700 transition">Back to Website</button>
                `;
                form.reset();
            } else {
                result.className = "mt-6 p-6 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl text-center";
                result.innerHTML = `
                    <div class="text-3xl font-bold mb-2">✕</div>
                    <h4 class="font-bold text-lg mb-1">Submission Failed</h4>
                    <p class="text-sm mb-4">${jsonResponse.message}</p>
                    <button onclick="resetForm()" class="bg-rose-600 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-rose-700 transition">Try Again</button>
                `;
            }
        })
        .catch(error => {
            result.classList.remove('hidden');
            result.className = "mt-6 p-6 bg-rose-50 border border-rose-200 text-rose-800 rounded-xl text-center";
            result.innerHTML = `<p class="text-sm">Network error. Please email us directly at partners@theprimerealestates.com</p>`;
            submitBtn.disabled = false;
            submitBtn.textContent = "Submit Enquiry";
        });
});

function resetForm() {
    result.classList.add('hidden');
    submitBtn.disabled = false;
    submitBtn.textContent = "Submit Enquiry";
}
</script>
