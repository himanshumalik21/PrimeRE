<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cloud Property Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 p-8" x-data="propertyApp()">

    <div class="max-w-4xl mx-auto bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
        <h1 class="text-xl font-bold mb-4">Cloud Property Database Dashboard</h1>

        <!-- Add Form -->
        <form @submit.prevent="addProperty" class="grid grid-cols-2 gap-4 mb-6 pb-6 border-b">
            <input type="text" x-model="form.property_id" placeholder="Property ID (e.g. PR-01)" class="border p-2 rounded-lg text-sm" required>
            <input type="text" x-model="form.name" placeholder="Property Name" class="border p-2 rounded-lg text-sm" required>
            <input type="text" x-model="form.address" placeholder="Address" class="border p-2 rounded-lg text-sm col-span-2" required>
            <textarea x-model="form.report_notes" placeholder="Inspection / Maintenance Report..." class="border p-2 rounded-lg text-sm col-span-2"></textarea>
            <button type="submit" class="bg-blue-600 text-white py-2 rounded-lg text-sm font-semibold col-span-2">Save Property & Report</button>
        </form>

        <!-- Property List Display -->
        <div class="space-y-4">
            <template x-for="prop in properties" :key="prop.id">
                <div class="border p-4 rounded-xl flex justify-between items-start bg-slate-50">
                    <div>
                        <span class="bg-slate-900 text-white text-xs px-2 py-0.5 rounded font-mono" x-text="prop.property_id"></span>
                        <h3 class="font-bold text-slate-800 mt-1" x-text="prop.name"></h3>
                        <p class="text-xs text-slate-500" x-text="prop.address"></p>
                        <p class="text-xs text-blue-600 mt-2 bg-blue-50 p-2 rounded border border-blue-100">
                            <strong>Report:</strong> <span x-text="prop.report_notes || 'No reports logged.'"></span>
                        </p>
                    </div>
                    <button @click="deleteProperty(prop.id)" class="text-red-500 hover:text-red-700 text-xs font-semibold">Delete</button>
                </div>
            </template>
        </div>
    </div>

    <script>
        // Initialize Supabase Client with your credentials
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function propertyApp() {
            return {
                properties: [],
                form: { property_id: '', name: '', address: '', report_notes: '' },

                async init() {
                    await this.fetchProperties();
                },

                async fetchProperties() {
                    let { data, error } = await _supabase.from('properties').select('*').order('id', { ascending: false });
                    if (!error) this.properties = data;
                },

                async addProperty() {
                    let { error } = await _supabase.from('properties').insert([this.form]);
                    if (!error) {
                        this.form = { property_id: '', name: '', address: '', report_notes: '' };
                        this.fetchProperties();
                    } else {
                        alert('Error adding property: ' + error.message);
                    }
                },

                async deleteProperty(id) {
                    if (confirm('Are you sure you want to delete this record?')) {
                        let { error } = await _supabase.from('properties').delete().eq('id', id);
                        if (!error) this.fetchProperties();
                    }
                }
            }
        }
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
