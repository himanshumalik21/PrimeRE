<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malik Family Office | Property Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen selection:bg-blue-600 selection:text-white" x-data="propertyApp()">

    <!-- ================= 1. PASSWORD LOCK SCREEN ================= -->
    <div x-cloak x-show="!authenticated" class="fixed inset-0 bg-slate-950/70 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl max-w-sm w-full p-8 border border-slate-100 text-center">
            <div class="w-14 h-14 bg-slate-900 text-white rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-slate-900/20 text-xl">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900 tracking-tight">Restricted Access</h1>
            <p class="text-xs text-slate-500 mt-1 mb-6">Enter master passcode to unlock portfolio.</p>
            
            <form @submit.prevent="authenticate">
                <div class="mb-4">
                    <input type="password" x-model="passwordInput" placeholder="Master passcode..." 
                        class="w-full px-4 py-3 bg-slate-50 rounded-xl border border-slate-200 text-center text-sm font-mono tracking-widest focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition">
                    <p x-show="authError" class="text-red-500 text-xs mt-2 font-medium" x-text="authError"></p>
                </div>
                <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 rounded-xl transition duration-200 shadow-md shadow-slate-900/10 text-sm">
                    Unlock Portal
                </button>
            </form>
        </div>
    </div>

    <!-- ================= 2. MAIN APP DASHBOARD ================= -->
    <div x-cloak x-show="authenticated" class="flex flex-col min-h-screen">
        
        <!-- Clean Minimal Header -->
        <header class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-30">
            <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
                <div class="flex items-center space-x-3.5">
                    <div class="w-10 h-10 bg-slate-900 text-white rounded-xl flex items-center justify-center shadow-md shadow-slate-900/10">
                        <i class="fa-solid fa-building text-sm"></i>
                    </div>
                    <div>
                        <span class="font-bold text-sm text-slate-900 tracking-tight block">Malik Family Office</span>
                        <span class="text-[11px] text-slate-400 font-medium tracking-wide">Property Management System</span>
                    </div>
                </div>
                <div class="flex items-center space-x-3">
                    <button @click="openModal()" class="bg-slate-900 hover:bg-slate-800 text-white px-4 py-2.5 rounded-xl text-xs font-semibold transition flex items-center space-x-2 shadow-sm">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                        <span>Add Property</span>
                    </button>
                    <button @click="lockApp()" class="w-9 h-9 flex items-center justify-center bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl transition text-xs" title="Lock Portal">
                        <i class="fa-solid fa-lock"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-10">
            
            <!-- Dashboard Controls Header -->
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
                <div>
                    <h2 class="text-xl font-bold text-slate-900 tracking-tight">Active Portfolio</h2>
                    <p class="text-xs text-slate-500 mt-0.5">Real-time cloud property records, metrics, and site reports.</p>
                </div>
                <div class="w-full sm:w-72 relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search text-xs"></i>
                    </span>
                    <input type="text" x-model="searchQuery" placeholder="Search ID, address, notes..." 
                        class="w-full pl-9 pr-4 py-2.5 bg-white rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
                </div>
            </div>

            <!-- Loading Spinner -->
            <div x-show="loading" class="text-center py-24">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-slate-900 mb-3"></i>
                <p class="text-xs text-slate-400 font-medium tracking-wide">Fetching cloud records...</p>
            </div>

            <!-- Empty State -->
            <template x-if="!loading && filteredProperties.length === 0">
                <div class="bg-white rounded-2xl border border-slate-100 p-16 text-center shadow-sm">
                    <div class="w-12 h-12 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-base">
                        <i class="fa-solid fa-folder-open"></i>
                    </div>
                    <h3 class="text-sm font-bold text-slate-900">No properties found</h3>
                    <p class="text-xs text-slate-400 mt-1 mb-6">Initialize your asset register by creating your first record.</p>
                    <button @click="openModal()" class="bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs font-medium hover:bg-slate-800 transition">
                        Add First Property
                    </button>
                </div>
            </template>

            <!-- Modern Card Grid Layout -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" x-show="!loading">
                <template x-for="property in filteredProperties" :key="property.id">
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col overflow-hidden group">
                        
                        <!-- Card Image Banner / Aesthetic Gradient Header -->
                        <div class="h-44 relative bg-slate-100 bg-cover bg-center overflow-hidden" 
                             :style="property.image ? `background-image: url('${property.image}')` : 'background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);'">
                            <div class="absolute inset-0 bg-gradient-to-t from-slate-950/70 via-slate-950/20 to-transparent"></div>
                            
                            <!-- Top Tags -->
                            <div class="absolute top-3.5 left-3.5 right-3.5 flex justify-between items-center z-10">
                                <span class="bg-white/90 backdrop-blur-md text-slate-900 text-[10px] font-mono font-bold px-2.5 py-1 rounded-lg shadow-sm" x-text="property.property_id"></span>
                                <span class="bg-slate-900/80 backdrop-blur-md text-white text-[10px] font-semibold px-2.5 py-1 rounded-lg tracking-wide uppercase" x-text="property.category || 'Residential'"></span>
                                <span class="bg-slate-900/80 backdrop-blur-md text-white text-[10px] font-semibold px-2.5 py-1 rounded-lg tracking-wide uppercase" x-text="property.municipality || 'Gurugram'"></span>
                            </div>

                            <!-- Bottom Title Overlay Inside Image Header -->
                            <div class="absolute bottom-3.5 left-3.5 right-3.5 z-10">
                                <h3 class="font-bold text-white text-base tracking-tight drop-shadow-sm truncate" x-text="property.name"></h3>
                                <p class="text-slate-200 text-[11px] flex items-center space-x-1 mt-0.5 opacity-90 truncate">
                                    <i class="fa-solid fa-location-dot text-[10px] shrink-0"></i>
                                    <span x-text="property.address"></span>
                                </p>
                            </div>
                        </div>

                        <!-- Card Content Body -->
                        <div class="p-5 flex-grow flex flex-col justify-between space-y-4">
                            
                            <!-- Area & Status Pills -->
                            <div class="grid grid-cols-2 gap-2 bg-slate-50/80 p-3 rounded-xl border border-slate-100 text-xs">
                                <div>
                                    <span class="block text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Area</span>
                                    <span class="font-bold text-slate-900 mt-0.5 block"><span x-text="property.area ? Number(property.area).toLocaleString() : '0'"></span></span>
                                </div>
                                <div>
                                    <span class="block text-[10px] uppercase tracking-wider text-slate-400 font-semibold">Status</span>
                                    <span class="font-semibold text-slate-700 mt-0.5 block inline-flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 rounded-full" :class="property.status === 'Occupied' ? 'bg-emerald-500' : (property.status === 'Vacant' ? 'bg-amber-500' : 'bg-blue-500')"></span>
                                        <span x-text="property.status || 'Vacant'"></span>
                                    </span>
                                </div>
                            </div>

                            <!-- Notes / Reports Box -->
                            <div class="text-xs">
                                <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold mb-1 flex items-center justify-between">
                                    <span><i class="fa-solid fa-clipboard-list mr-1 text-[9px]"></i> Notes </span>
                                </div>
                                <p class="text-slate-600 bg-slate-50/50 p-2.5 rounded-xl border border-slate-100 leading-relaxed italic line-clamp-2" x-text="property.notes || 'No activity notes logged.'"></p>
                            </div>

                            <!-- Action Buttons -->
                            <div class="flex items-center justify-end space-x-2 pt-3 border-t border-slate-100">
                                <button @click="editProperty(property)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-medium transition flex items-center space-x-1">
                                    <i class="fa-solid fa-pen-to-square text-[10px]"></i>
                                    <span>Edit</span>
                                </button>
                                <button @click="deleteProperty(property.id)" class="px-3 py-1.5 bg-red-50 hover:bg-red-100 text-red-600 rounded-lg text-xs font-medium transition flex items-center space-x-1">
                                    <i class="fa-solid fa-trash text-[10px]"></i>
                                    <span>Delete</span>
                                </button>
                            </div>

                        </div>

                    </div>
                </template>
            </div>

        </main>

        <!-- ================= 3. ADD/EDIT PROPERTY MODAL ================= -->
        <div x-cloak x-show="isModalOpen" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto">
            <div @click.outside="closeModal()" class="bg-white rounded-3xl shadow-2xl max-w-lg w-full p-8 border border-slate-100 my-8">
                <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-100">
                    <div>
                        <h3 class="text-base font-bold text-slate-900 tracking-tight" x-text="isEditing ? 'Edit Property Record' : 'Register New Property'"></h3>
                        <p class="text-xs text-slate-400 mt-0.5">Configure asset details, valuation, and inspection logs.</p>
                    </div>
                    <button @click="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 hover:text-slate-600 transition"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>

                <form @submit.prevent="saveProperty" class="space-y-4 text-xs">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Property ID</label>
                            <input type="text" x-model="form.property_id" required placeholder="e.g. PROP-101" 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Property Name</label>
                            <input type="text" x-model="form.name" required placeholder="e.g. Sunset Heights Unit 4B" 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Full Street Address</label>
                        <input type="text" x-model="form.address" required placeholder="e.g. 742 Evergreen Terrace, Sector 54" 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Asset Type</label>
                            <select x-model="form.type" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
                                <option value="Residential">Residential</option>
                                <option value="Commercial">Commercial</option>
                                <option value="Industrial">Industrial</option>
                                <option value="Land / Plot">Land / Plot</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Status</label>
                            <select x-model="form.status" class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
                                <option value="Occupied">Occupied</option>
                                <option value="Vacant">Vacant</option>
                                <option value="Under Maintenance">Under Maintenance</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Valuation ($)</label>
                            <input type="number" x-model="form.valuation" placeholder="e.g. 350000" 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
                        </div>
                        <div>
                            <label class="block font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Image URL (Optional)</label>
                            <input type="url" x-model="form.image" placeholder="https://images.unsplash.com/..." 
                                class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
                        </div>
                    </div>

                    <div>
                        <label class="block font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Inspection & Activity Reports</label>
                        <textarea x-model="form.report_notes" rows="3" placeholder="Enter periodic maintenance notes, tenant feedback, inspection reports..." 
                            class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-slate-900 transition"></textarea>
                    </div>

                    <div class="flex justify-end space-x-3 pt-5 border-t border-slate-100">
                        <button type="button" @click="closeModal()" class="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-medium transition">Cancel</button>
                        <button type="submit" class="px-5 py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-xl font-medium transition shadow-md shadow-slate-900/10" x-text="isEditing ? 'Save Changes' : 'Save Property'"></button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <!-- ================= 4. APP LOGIC ================= -->
    <script>
        const SUPABASE_URL = 'https://gykkkehuhkoudiiyqagu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd5a2trZWh1aGtvdWRpaXlxYWd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzMzg1ODMsImV4cCI6MjEwMTkxNDU4M30.BMu-dJ0yARYFNahAjvN6D_yW2qXg_WfQc0db3RCmRiI'.trim();
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function propertyApp() {
            return {
                authenticated: false,
                passwordInput: '',
                authError: '',
                masterPassword: '#Himanshu21',
                
                loading: true,
                searchQuery: '',
                isModalOpen: false,
                isEditing: false,
                
                form: {
                    id: null,
                    property_id: '',
                    name: '',
                    address: '',
                    type: 'Residential',
                    status: 'Occupied',
                    valuation: '',
                    image: '',
                    report_notes: ''
                },

                properties: [],

                async init() {
                    await this.fetchProperties();
                },

                authenticate() {
                    if (this.passwordInput === this.masterPassword) {
                        this.authenticated = true;
                        this.authError = '';
                        this.passwordInput = '';
                    } else {
                        this.authError = 'Incorrect master passcode. Default is admin123';
                    }
                },

                lockApp() {
                    this.authenticated = false;
                },

                async fetchProperties() {
                    this.loading = true;
                    let { data, error } = await _supabase.from('properties').select('*').order('id', { ascending: false });
                    if (error) {
                        console.error('Error fetching data:', error.message);
                    } else {
                        this.properties = data || [];
                    }
                    this.loading = false;
                },

                get filteredProperties() {
                    if (!this.searchQuery) return this.properties;
                    const q = this.searchQuery.toLowerCase();
                    return this.properties.filter(p => 
                        (p.property_id && p.property_id.toLowerCase().includes(q)) || 
                        (p.address && p.address.toLowerCase().includes(q)) || 
                        (p.name && p.name.toLowerCase().includes(q)) ||
                        (p.report_notes && p.report_notes.toLowerCase().includes(q))
                    );
                },

                openModal() {
                    this.isEditing = false;
                    this.form = { id: null, property_id: '', name: '', address: '', type: 'Residential', status: 'Occupied', valuation: '', image: '', report_notes: '' };
                    this.isModalOpen = true;
                },

                editProperty(property) {
                    this.isEditing = true;
                    this.form = { ...property };
                    this.isModalOpen = true;
                },

                closeModal() {
                    this.isModalOpen = false;
                },

                async saveProperty() {
                    const payload = {
                        property_id: this.form.property_id,
                        name: this.form.name,
                        address: this.form.address,
                        type: this.form.type,
                        status: this.form.status,
                        valuation: this.form.valuation ? parseFloat(this.form.valuation) : null,
                        image: this.form.image,
                        report_notes: this.form.report_notes
                    };

                    if (this.isEditing) {
                        let { error } = await _supabase.from('properties').update(payload).eq('id', this.form.id);
                        if (error) {
                            alert('Update failed: ' + error.message);
                            return;
                        }
                    } else {
                        let { error } = await _supabase.from('properties').insert([payload]);
                        if (error) {
                            alert('Insert failed: ' + error.message);
                            return;
                        }
                    }
                    
                    await this.fetchProperties();
                    this.closeModal();
                },

                async deleteProperty(id) {
                    if (confirm('Are you sure you want to delete this property record from the cloud database?')) {
                        let { error } = await _supabase.from('properties').delete().eq('id', id);
                        if (error) {
                            alert('Delete failed: ' + error.message);
                        } else {
                            await this.fetchProperties();
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
